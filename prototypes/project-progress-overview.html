    {d:"2026-08-11",t:"功能覆盖率 87%，距 90% 目标有缺口"},
    {d:"2026-08-01",t:"回归用例重复率过高，需精简（已解决）"}
  ],
  "PRJ-2607": [

  ],
  "PRJ-2608": [

    {d:"2026-08-21",t:"剩余违例 37 处，修复速度约 15 处/天"},
    {d:"2026-08-14",t:"流片窗口若 8 月底未清零将错过，需评估改期"},

  ],
  "PRJ-2610": [

    {d:"2026-08-17",t:"器件模型选型评审未通过，返工中"},
    {d:"2026-08-09",t:"仿真精度与实测偏差偏大（分析中）"},
    {d:"2026-07-30",t:"规格评审遗留 2 项待澄清（已解决）"}
  ]
};
PROJECTS.forEach(p=>{ p.issues = ISSUE_LOGS[p.id] || []; });
const AVATAR_COLORS = { "陈明远":"#3370ff", "林嘉禾":"#ff8800", "周雪":"#14c0c4", "吴启航":"#8f6bf2", "郑澜":"#f54a45" };
</script>

<!-- ==================== 交互逻辑层 ==================== -->
<script>
// ---- apiMock ----
function apiMock(){ return PROJECTS; }

// ---- render ----
let state = { tab: "all", status: "all", owner: "all", customer: "all", q: "" };

function renderStats(){
  const total = PROJECTS.length;
  const ok = PROJECTS.filter(p=>p.status==="正常").length;
  const warn = PROJECTS.filter(p=>p.status==="风险").length;
  const late = PROJECTS.filter(p=>p.status==="延期").length;
  const msLate = PROJECTS.filter(p=>p.milestone && !p.milestone.done && !p.milestone.onTime).length;
  const done = PROJECTS.filter(p=>p.status==="已完成").length;
  const cards = [
    {label:"项目总数", value: total, cls:"", trend:`含已完成 ${done} 个 · 本月新增 2 个`},
    {label:"正常推进", value: ok, cls:"", trend:"关键节点按计划完成"},
    {label:"存在风险", value: warn, cls:"warn", trend:"需重点关注 2 项"},
    {label:"已延期", value: late, cls:"danger", trend:"延期占比 25%"},
    {label:"节点逾期", value: msLate, cls:"danger", trend:"关键节点未按计划完成"}
  ];
  document.getElementById("statCards").innerHTML = cards.map((c,i)=>`
    <div class="stat-card ${c.cls} ${c.cls?'':''}" onclick="filterByCard(${i})">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="trend">${c.trend}</div>
    </div>`).join("");
  document.getElementById("cAll").textContent = total;
  document.getElementById("cAbnormal").textContent = warn + late;
  document.getElementById("cOk").textContent = ok;
document.getElementById("cWarn").textContent = warn;
  document.getElementById("cLate").textContent = late;
  document.getElementById("cDone").textContent = done;
}

function tagClass(s){ return s==="正常"?"tag-ok":(s==="风险"?"tag-warn":"tag-danger"); }

function filtered(){
  return PROJECTS.filter(p=>{
    if(state.tab==="需关注" && (p.status==="正常"||p.status==="已完成")) return false;
    if(["正常","风险","延期","已完成"].includes(state.tab) && p.status!==state.tab) return false;
    if(state.status!=="all" && p.status!==state.status) return false;
    if(state.owner!=="all" && p.owner!==state.owner) return false;
    if(state.customer!=="all" && p.customer!==state.customer) return false;
    if(state.q && !(p.name+p.id).toLowerCase().includes(state.q.toLowerCase())) return false;
    return true;
  });
}

function renderTable(){
  const rows = filtered();
  document.getElementById("filterResult").textContent = `共 ${rows.length} / ${PROJECTS.length} 个项目`;
  document.getElementById("tbody").innerHTML = rows.length ? rows.map(p=>`
    <tr class="row" onclick="openDetail('${p.id}')">
      <td><div class="proj-name">${p.name}</div><div class="proj-code">${p.id} · ${p.code}</div></td>
      <td><span class="stage-pill">${p.stage}</span></td>
      <td><span class="tag ${tagClass(p.status)}">${p.status}</span></td>
      <td><div class="owner"><span class="avatar" style="background:${AVATAR_COLORS[p.owner]}">${p.owner[0]}</span>${p.owner}</div></td>
      <td>${p.customer}</td>
      <td>${p.due}</td>
      <td class="milestone">${p.milestone.done ? "✅ " : ""}${p.milestone.name}${p.milestone.done ? "（已完成）" : (p.milestone.onTime ? "（计划中）" : `<span class="late">（已逾期）</span>`)}</td>
      <td><div class="issue-text ${p.status!=='正常'?'late':''}">${p.issue}</div></td>
    </tr>`).join("") : `<tr class="empty-row"><td colspan="8">没有符合当前筛选条件的项目</td></tr>`;
}

// ---- render：异常聚焦区（Top 风险 / Top 延期） ----
function renderFocusZone(){
  const risks = PROJECTS.filter(p=>p.status==="风险");
  const lates = PROJECTS.filter(p=>p.status==="延期");
    const block = (title, list, tab, cls) => `
    <div class="focus-card">
    <div class="fc-head">
  <span class="fc-title ${cls}">${title} <span class="num">${list.length}</span></span>
    <span class="fc-viewall" onclick="filterByTab('${tab}')">查看全部 →</span>
      </div>
      ${list.slice(0,5).map(p=>`
      <div class="focus-item" onclick="openDetail('${p.id}')">
    <span class="avatar" style="background:${AVATAR_COLORS[p.owner]}">${p.owner[0]}</span>
    <div style="flex:1;min-width:0">
      <div class="fi-name">${p.name}</div>
      <div class="fi-sub">${p.owner} · 计划完成 ${p.due}</div>
      </div>
      <div class="fi-issue" title="${p.issue}">${p.issue==="—"?"—":p.issue}</div>
    </div>`).join("") || `<div class="fi-empty">暂无${title}项目</div>`}
    </div>`;
    document.getElementById("focusZone").innerHTML =
    block("风险项目 Top 5", risks, "风险", "fc-warn") + block("延期项目 Top 5", lates, "延期", "fc-danger");
    }

      // ---- 交互：抽屉式项目详情（基本信息 / 里程碑时间线 / 问题阻塞点 + 上一项/下一项） ----
    let drawerCtx = { ids: [], idx: 0, expanded: false };

function openDetail(id){
drawerCtx.ids = filtered().map(p=>p.id);
if(!drawerCtx.ids.includes(id)) drawerCtx.ids.push(id);
drawerCtx.idx = drawerCtx.ids.indexOf(id);
  drawerCtx.expanded = false;
  renderDrawer();
  document.getElementById("drawerMask").classList.add("show");
  }
  function closeDrawer(){ document.getElementById("drawerMask").classList.remove("show"); }

  function renderDrawer(){
  const p = PROJECTS.find(x=>x.id===drawerCtx.ids[drawerCtx.idx]);
const issues = p.issues || [];
  const shown = drawerCtx.expanded ? issues : issues.slice(0,3);
  const timelineHtml = p.milestones.map(m=>`
    <li class="${m.s}"><div style="display:flex;justify-content:space-between;gap:10px">
      <span>${m.n}</span><span style="color:var(--text-3);font-size:12px">${m.d}</span></div>
      <span class="tag ${m.s==='done'?'tag-ok':(m.s==='late'?'tag-danger':'')}" style="${m.s==='plan'?'background:var(--bg);color:var(--text-3)':''};margin-top:4px">${m.s==='done'?'已完成':(m.s==='late'?'已逾期':'计划中')}</span></li>`).join("");
  const issueLis = shown.map(i=>`
    <li><span class="d">${i.d}</span><span>${i.t}</span></li>`).join("");
  const issueHtml = issueLis
    ? `<ul class="issue-list">${issueLis}</ul>${issues.length>3 ? `<span class="issue-more" onclick="toggleIssues()">${drawerCtx.expanded?"收起":`展开全部（还有 ${issues.length-3} 条）`}</span>` : ""}`
    : `<div style="font-size:13px;color:var(--text-2);line-height:1.7">暂无阻塞，项目按计划推进。</div>`;
  const hasPrev = drawerCtx.idx > 0, hasNext = drawerCtx.idx < drawerCtx.ids.length - 1;
  document.getElementById("drawerBody").innerHTML = `
    <div class="drawer-scroll">
      <div class="drawer-head">
        <div><h3>${p.name} <span class="tag ${tagClass(p.status)}" style="margin-left:8px">${p.status}</span></h3>
        <div class="proj-code" style="margin-top:6px">${p.id} · ${p.code}</div></div>
        <span class="drawer-close" onclick="closeDrawer()">✕</span>
      </div>
      <h4 class="plain">基本信息</h4>
      <div class="kv-grid">
        <div class="kv"><div class="k">项目名称</div><div class="v">${p.name}</div></div>
        <div class="kv"><div class="k">客户</div><div class="v">${p.customer}</div></div>
        <div class="kv"><div class="k">负责人</div><div class="v">${p.owner}</div></div>
        <div class="kv"><div class="k">当前阶段</div><div class="v">${p.stage}（阶段 ${STAGES.indexOf(p.stage)+1}/${STAGES.length}）</div></div>
        <div class="kv"><div class="k">状态</div><div class="v"><span class="tag ${tagClass(p.status)}">${p.status}</span></div></div>
        <div class="kv"><div class="k">计划完成时间</div><div class="v">${p.due}</div></div>
      </div>
      <h4>里程碑时间线</h4><ul class="ms-timeline">${timelineHtml}</ul>
      <h4>问题与阻塞点</h4>${issueHtml}
    </div>
    <div class="drawer-footer">
      <button class="btn" ${hasPrev?"":"disabled"} onclick="prevProject()">← 上一项</button>
      <span class="drawer-count">${drawerCtx.idx+1} / ${drawerCtx.ids.length}</span>
      <button class="btn" ${hasNext?"":"disabled"} onclick="nextProject()">下一项 →</button>
    </div>`;
}
function toggleIssues(){ drawerCtx.expanded = !drawerCtx.expanded; renderDrawer(); }
function prevProject(){ if(drawerCtx.idx>0){ drawerCtx.idx--; drawerCtx.expanded=false; renderDrawer(); } }
function nextProject(){ if(drawerCtx.idx<drawerCtx.ids.length-1){ drawerCtx.idx++; drawerCtx.expanded=false; renderDrawer(); } }

// ---- 交互：指标卡 / Tab 快捷筛选 ----
function syncTabs(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===state.tab));
}
function applyTab(tab){
  state.tab = tab; state.status = "all";
  document.getElementById("fStatus").value = "all";
  syncTabs(); renderTable();
}
function filterByTab(tab){ applyTab(tab); }
function filterByCard(i){
  const map = ["all","正常","风险","延期","需关注"];
  applyTab(map[i] || "all");
}

// ---- bindEvents ----
function bindEvents(){
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ applyTab(t.dataset.tab); });
  document.getElementById("fStatus").onchange = e=>{ state.status=e.target.value; renderTable(); };
  document.getElementById("fOwner").onchange = e=>{ state.owner=e.target.value; renderTable(); };
  document.getElementById("fCustomer").onchange = e=>{ state.customer=e.target.value; renderTable(); };
  document.getElementById("fSearch").oninput = e=>{ state.q=e.target.value.trim(); renderTable(); };
  document.getElementById("drawerMask").onclick = e=>{ if(e.target.id==="drawerMask") closeDrawer(); };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDrawer(); });
}

let toastTimer=null;
function toast(msg){
  const el=document.getElementById("toastEl");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),1800);
}

// ---- init ----
function init(){ renderStats(); renderFocusZone(); renderTable(); bindEvents(); }
init();
</script>
</body>
</html>
