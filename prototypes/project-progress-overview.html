<!-- ==================== 样式层 ==================== -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #3370ff; --primary-hover: #2b5fd9;
    --bg: #f5f6f8; --card: #ffffff; --border: #e5e6eb;
    --text: #1f2329; --text-2: #646a73; --text-3: #8f959e;
    --ok: #34c724; --ok-bg: #eaf9e8;
    --warn: #ff8800; --warn-bg: #fff3e0;
    --danger: #f54a45; --danger-bg: #feeceb;
    --shadow: 0 1px 2px rgba(31,35,41,.06);
  }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  .page { max-width: 1280px; margin: 0 auto; padding: 24px; }

  /* Component: TopBar */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .top-bar h1 { font-size: 20px; font-weight: 600; }
  .top-bar .sub { color: var(--text-3); font-size: 12px; margin-top: 4px; }
  .top-actions { display: flex; gap: 12px; }
  .btn { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 7px 16px; cursor: pointer; font-size: 13px; color: var(--text); transition: all .15s; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); color: #fff; }

  /* Component: StatCards */
  .stat-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--card); border-radius: 8px; padding: 16px; box-shadow: var(--shadow); cursor: pointer; border: 1px solid transparent; }
  .stat-card:hover, .stat-card.active { border-color: var(--primary); }
  .stat-card .label { color: var(--text-2); font-size: 12px; }
  .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .stat-card .trend { font-size: 11px; margin-top: 4px; color: var(--text-3); }
  .stat-card.danger .value { color: var(--danger); }
  .stat-card.warn .value { color: var(--warn); }

  /* Component: FilterBar */
  .filter-bar { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 8px; padding: 12px 16px; box-shadow: var(--shadow); margin-bottom: 20px; flex-wrap: wrap; }
  .filter-bar label { color: var(--text-2); font-size: 12px; }
  .select, .search { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; background: #fff; color: var(--text); outline: none; }
  .select:focus, .search:focus { border-color: var(--primary); }
  .search { width: 240px; }
  .filter-result { margin-left: auto; color: var(--text-3); font-size: 12px; }

  /* Component: ProjectTable */
  .table-wrap { background: var(--card); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
  .table-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; }
  .tab { padding: 12px 16px; cursor: pointer; font-size: 14px; color: var(--text-2); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tab .count { background: var(--bg); border-radius: 8px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--text-3); font-weight: 500; padding: 10px 16px; background: #fafbfc; border-bottom: 1px solid var(--border); }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr.row { cursor: pointer; transition: background .12s; }
  tr.row:hover { background: #f7f9ff; }
  .proj-name { font-weight: 600; }
  .proj-code { color: var(--text-3); font-size: 11px; margin-top: 2px; }
  .owner { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 12px; }
  .tag-ok { color: var(--ok); background: var(--ok-bg); }
  .tag-warn { color: var(--warn); background: var(--warn-bg); }
  .tag-danger { color: var(--danger); background: var(--danger-bg); }
  .stage-pill { display: inline-block; background: var(--bg); color: var(--text-2); border-radius: 4px; padding: 2px 8px; font-size: 12px; }
  .milestone { font-size: 12px; color: var(--text-2); }
  .milestone .late { color: var(--danger); }
  .issue-text { color: var(--text-2); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .issue-text.late { color: var(--danger); }
  .view-btn { color: var(--primary); font-size: 12px; cursor: pointer; white-space: nowrap; }
  .empty-row td { text-align: center; color: var(--text-3); padding: 40px; }

  /* Component: DetailModal */
  .modal-mask { position: fixed; inset: 0; background: rgba(31,35,41,.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 10px; width: 680px; max-height: 82vh; overflow-y: auto; padding: 24px; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .modal-head h3 { font-size: 17px; }
  .modal-close { cursor: pointer; color: var(--text-3); font-size: 18px; line-height: 1; }
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin: 14px 0; }
  .kv .k { color: var(--text-3); font-size: 12px; }
  .kv .v { margin-top: 2px; font-size: 13px; }
  .modal h4 { font-size: 14px; margin: 18px 0 10px; padding-top: 14px; border-top: 1px solid var(--border); }
  .ms-list { list-style: none; }
  .ms-list li { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; border-bottom: 1px dashed var(--bg); }
  .ms-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ms-dot.done { background: var(--ok); }
  .ms-dot.plan { background: var(--border); }
  .ms-dot.late { background: var(--danger); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 8px 20px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; z-index: 200; }
  .toast.show { opacity: .92; }

  @media (max-width: 900px) { .stat-cards { grid-template-columns: repeat(2,1fr); } .kv-grid { grid-template-columns: 1fr; } }
</style>
</head>

<!-- ==================== 交互逻辑层 ==================== -->
<script>
// ---- apiMock ----
function apiMock(){ return PROJECTS; }

// ---- render ----
let state = { tab: "all", status: "all", owner: "all", customer: "all", q: "" };

function renderStats(){
  const total = PROJECTS.length;
  const ok = PROJECTS.filter(p=>p.status==="正常").length;
  const warn = PROJECTS.filter(p=>p.status==="风险").length;
  const late = PROJECTS.filter(p=>p.status==="延期").length;
  const msLate = PROJECTS.filter(p=>p.milestone && !p.milestone.done && !p.milestone.onTime).length;
  const cards = [
    {label:"推进中项目", value: total, cls:"", trend:"本月新增 2 个 · 结项 1 个"},
    {label:"正常推进", value: ok, cls:"", trend:"关键节点按计划完成"},
    {label:"存在风险", value: warn, cls:"warn", trend:"需重点关注 2 项"},
    {label:"已延期", value: late, cls:"danger", trend:"延期占比 25%"},
    {label:"节点逾期", value: msLate, cls:"danger", trend:"关键节点未按计划完成"}
  ];
  document.getElementById("statCards").innerHTML = cards.map((c,i)=>`
    <div class="stat-card ${c.cls} ${c.cls?'':''}" onclick="filterByCard(${i})">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="trend">${c.trend}</div>
    </div>`).join("");
  document.getElementById("cAll").textContent = total;
  document.getElementById("cAbnormal").textContent = warn + late;
  document.getElementById("cLate").textContent = late;
}

function tagClass(s){ return s==="正常"?"tag-ok":(s==="风险"?"tag-warn":"tag-danger"); }

function filtered(){
  return PROJECTS.filter(p=>{
    if(state.tab==="异常" && p.status==="正常") return false;
    if(state.tab==="延期" && p.status!=="延期") return false;
    if(state.status!=="all" && p.status!==state.status) return false;
    if(state.owner!=="all" && p.owner!==state.owner) return false;
    if(state.customer!=="all" && p.customer!==state.customer) return false;
    if(state.q && !(p.name+p.id).toLowerCase().includes(state.q.toLowerCase())) return false;
    return true;
  });
}

function renderTable(){
  const rows = filtered();
  document.getElementById("filterResult").textContent = `共 ${rows.length} / ${PROJECTS.length} 个项目`;
  document.getElementById("tbody").innerHTML = rows.length ? rows.map(p=>`
    <tr class="row" onclick="openDetail('${p.id}')">
      <td><div class="proj-name">${p.name}</div><div class="proj-code">${p.id} · ${p.code}</div></td>
      <td><span class="stage-pill">${p.stage}</span></td>
      <td><span class="tag ${tagClass(p.status)}">${p.status}</span></td>
      <td><div class="owner"><span class="avatar" style="background:${AVATAR_COLORS[p.owner]}">${p.owner[0]}</span>${p.owner}</div></td>
      <td>${p.customer}</td>
      <td>${p.due}</td>
      <td class="milestone">${p.milestone.done ? "✅ " : ""}${p.milestone.name}${p.milestone.done ? "（已完成）" : (p.milestone.onTime ? "（计划中）" : `<span class="late">（已逾期）</span>`)}</td>
      <td><div class="issue-text ${p.status!=='正常'?'late':''}">${p.issue}</div></td>
    </tr>`).join("") : `<tr class="empty-row"><td colspan="8">没有符合当前筛选条件的项目</td></tr>`;
}

// ---- 交互：详情弹窗 ----
function openDetail(id){
  const p = PROJECTS.find(x=>x.id===id);
  const msHtml = p.milestones.map(m=>`
    <li><span class="ms-dot ${m.s}"></span><span style="flex:1">${m.n}</span>
    <span style="color:var(--text-3);font-size:12px">${m.d}</span>
    <span class="tag ${m.s==='done'?'tag-ok':(m.s==='late'?'tag-danger':'tag-ok')}" style="${m.s==='plan'?'background:var(--bg);color:var(--text-3)':''}">${m.s==='done'?'已完成':(m.s==='late'?'已逾期':'计划中')}</span></li>`).join("");
  document.getElementById("modalBody").innerHTML = `
    <div class="modal-head">
      <div><h3>${p.name} <span class="tag ${tagClass(p.status)}" style="margin-left:8px">${p.status}</span></h3>
      <div class="proj-code" style="margin-top:6px">${p.id} · ${p.code}</div></div>
      <span class="modal-close" onclick="closeModal()">✕</span>
    </div>
    <div class="kv-grid">
      <div class="kv"><div class="k">当前阶段</div><div class="v">${p.stage}（阶段 ${STAGES.indexOf(p.stage)+1}/${STAGES.length}）</div></div>
      <div class="kv"><div class="k">负责人</div><div class="v">${p.owner}</div></div>
      <div class="kv"><div class="k">客户</div><div class="v">${p.customer}</div></div>
      <div class="kv"><div class="k">计划完成时间</div><div class="v">${p.due}</div></div>
    </div>
    <h4>关键节点</h4><ul class="ms-list">${msHtml}</ul>
    <h4>当前问题 / 阻塞点</h4>
    <div style="font-size:13px;color:var(--text-2);line-height:1.7">${p.issue==="—"?"暂无阻塞，项目按计划推进。":p.issue}</div>
    <div class="modal-actions">
      <button class="btn" onclick="toast('已通知负责人更新进展（示例交互）');closeModal()">提醒负责人更新</button>
      <button class="btn btn-primary" onclick="toast('已进入项目详情页（示例交互）')">查看完整详情</button>
    </div>`;
  document.getElementById("modalMask").classList.add("show");
}
function closeModal(){ document.getElementById("modalMask").classList.remove("show"); }

function filterByCard(i){
  if(i===0) { state.tab="all"; state.status="all"; }
  if(i===1) state.status="正常";
  if(i===2) state.status="风险";
  if(i===3) state.tab="延期";
  if(i===4) state.tab="异常";
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===state.tab));
  document.getElementById("fStatus").value = state.status==="all"?"all":state.status;
  renderTable();
}

// ---- bindEvents ----
function bindEvents(){
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); state.tab=t.dataset.tab; renderTable();
  });
  document.getElementById("fStatus").onchange = e=>{ state.status=e.target.value; renderTable(); };
  document.getElementById("fOwner").onchange = e=>{ state.owner=e.target.value; renderTable(); };
  document.getElementById("fCustomer").onchange = e=>{ state.customer=e.target.value; renderTable(); };
  document.getElementById("fSearch").oninput = e=>{ state.q=e.target.value.trim(); renderTable(); };
  document.getElementById("modalMask").onclick = e=>{ if(e.target.id==="modalMask") closeModal(); };
}

let toastTimer=null;
function toast(msg){
  const el=document.getElementById("toastEl");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),1800);
}

// ---- init ----
function init(){ renderStats(); renderTable(); bindEvents(); }
init();
</script>
