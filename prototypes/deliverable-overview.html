// "empty" 在数据中表示该阶段尚未要求该交付物（不适用），用 na 显示
// "missing" 表示应交未交——这里用 phaseContext 标注
var NA_BEFORE = {}; // 每个交付物在其"卡控阶段"之前均为 N/A

/* ===== Render Layer ===== */
function getStatusClass(s) {
  if (s === "Initial") return "s-initial";
  if (s === "Review") return "s-review";
  if (s === "Stable") return "s-stable";
  if (s === "Final") return "s-final";
  return "";
}

function renderMatrix(data) {
  var tbody = document.getElementById("matrix-body");
  tbody.innerHTML = "";
  data.forEach(function(d, di) {
    var tr = document.createElement("tr");
    // 交付物名称列
    var tdName = document.createElement("td");
    tdName.className = "col-deliverable";
    tdName.innerHTML =
      '<div class="deliv-name">' + d.name + '</div>' +
      '<div class="deliv-stage"><span class="tag-stage">' + d.stageTag + '</span>' +
      '<span>责任人: ' + d.owner + '</span></div>';
    tr.appendChild(tdName);

    // 状态单元格
    var firstNonEmpty = -1;
    for (var k = 0; k < d.statusLine.length; k++) {
      if (d.statusLine[k] !== "empty") { firstNonEmpty = k; break; }
    }

    d.statusLine.forEach(function(s, si) {
      var td = document.createElement("td");
      td.className = "cell";
      var isNA = (firstNonEmpty === -1 || si < firstNonEmpty);
      if (isNA) {
        td.innerHTML = '<span class="s-na">—</span>';
        td.style.cursor = "default";
      } else if (s === "empty") {
        // 应交未交 = 缺失风险
        td.innerHTML = '<span class="status-pill s-empty">缺失</span>';
        td.onclick = (function(item, idx) {
          return function() { openDrawer(item, idx); };
        })(d, si);
      } else {
        td.innerHTML = '<span class="status-pill ' + getStatusClass(s) + '">' + s + '</span>';
        td.onclick = (function(item, idx) {
          return function() { openDrawer(item, idx); };
        })(d, si);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

/* ===== Drawer ===== */
function openDrawer(d, phaseIdx) {
  document.getElementById("drawer-title").textContent = d.name;
  document.getElementById("drawer-sub").textContent = d.stageTag + " · 责任人: " + d.owner;

  var status = d.statusLine[phaseIdx];
  var statusText = (status === "empty") ? "缺失（未提交）" : status;
  var body = "";

  // 当前状态
  body += '<div class="drawer-section">';
  body += '<div class="drawer-section-title">当前状态</div>';
  body += '<div class="info-row"><span class="info-label">所处阶段</span><span class="info-value">' + PHASE_LABELS[phaseIdx] + '</span></div>';
  body += '<div class="info-row"><span class="info-label">状态</span><span class="info-value"><span class="status-pill ' + getStatusClass(status) + '">' + statusText + '</span></span></div>';
  body += '<div class="info-row"><span class="info-label">责任人</span><span class="info-value">' + d.owner + '</span></div>';
  body += '</div>';

  // 应交口径
  body += '<div class="drawer-section">';
  body += '<div class="drawer-section-title">阶段应交口径</div>';
  body += '<div class="info-row"><span class="info-value" style="line-height:1.6;">' + d.detail.criterion + '</span></div>';
  body += '</div>';

  // 文档链接
  body += '<div class="drawer-section">';
  body += '<div class="drawer-section-title">文档链接</div>';
  body += '<a class="doc-link" href="javascript:void(0)" onclick="showToast(\'打开文档: ' + d.name + '\')">📄 ' + d.docLink + '</a>';
  body += '</div>';

  // 更新记录
  body += '<div class="drawer-section">';
  body += '<div class="drawer-section-title">最近更新记录</div>';
  d.detail.updates.forEach(function(u, i) {
    body += '<div class="timeline-item">';
    body += '<div class="timeline-dot ' + (i === d.detail.updates.length - 1 ? "gray" : "") + '"></div>';
    body += '<div><div class="timeline-time">' + u.time + '</div><div class="timeline-text">' + u.text + '</div></div>';
    body += '</div>';
  });
  body += '</div>';

  document.getElementById("drawer-body").innerHTML = body;
  document.getElementById("drawer-mask").classList.add("show");
  document.getElementById("drawer").classList.add("show");
}

function closeDrawer() {
  document.getElementById("drawer-mask").classList.remove("show");
  document.getElementById("drawer").classList.remove("show");
}

/* ===== Filter Logic ===== */
function applyFilters() {
  var phase = document.getElementById("filter-phase").value;
  var status = document.getElementById("filter-status").value;
  var type = document.getElementById("filter-type").value;
  var owner = document.getElementById("filter-owner").value;
  var kw = document.getElementById("filter-keyword").value.trim().toLowerCase();

  var filtered = DELIVERABLES.filter(function(d) {
    if (type && d.type !== type) return false;
    if (owner && d.owner !== owner) return false;
    if (kw && d.name.toLowerCase().indexOf(kw) === -1) return false;
    if (status) {
      var hasStatus = false;
      var firstNonEmpty = -1;
      for (var k = 0; k < d.statusLine.length; k++) {
        if (d.statusLine[k] !== "empty") { firstNonEmpty = k; break; }
      }
      for (var i = 0; i < d.statusLine.length; i++) {
        var isNA = (firstNonEmpty === -1 || i < firstNonEmpty);
        if (isNA) continue;
        var s = d.statusLine[i];
        if (status === "empty" && s === "empty") hasStatus = true;
        if (s === status) hasStatus = true;
      }
      if (!hasStatus) return false;
    }
    if (phase) {
      var phaseMap = {
        "charter": 0, "tr1": 1, "tr2": 2, "tr3": 3,
        "tr4": [4,5,6,7], "tr5": 8, "ga": 10
      };
      var idx = phaseMap[phase];
      var indices = Array.isArray(idx) ? idx : [idx];
      var phaseHas = false;
      indices.forEach(function(i) {
        var firstNonEmpty = -1;
        for (var k = 0; k < d.statusLine.length; k++) {
          if (d.statusLine[k] !== "empty") { firstNonEmpty = k; break; }
        }
        var isNA = (firstNonEmpty === -1 || i < firstNonEmpty);
        if (!isNA) phaseHas = true;
      });
      if (!phaseHas) return false;
    }
    return true;
  });

  renderMatrix(filtered);
  showToast("筛选完成，共 " + filtered.length + " 项");
}

function resetFilters() {
  document.getElementById("filter-phase").value = "";
  document.getElementById("filter-status").value = "";
  document.getElementById("filter-type").value = "";
  document.getElementById("filter-owner").value = "";
  document.getElementById("filter-keyword").value = "";
  renderMatrix(DELIVERABLES);
  showToast("已重置筛选");
}

/* ===== Toast ===== */
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 2200);
}

/* ===== Init ===== */
function init() {
  renderMatrix(DELIVERABLES);
}
init();
