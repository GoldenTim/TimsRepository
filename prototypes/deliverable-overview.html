<html lang="zh-CN">

    需求来源：https://project.feishu.cn/1fknv3/story/detail/7058554577
    生成时间：2026-07-29
    生成工具：CodeM Auto
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f5f6f8;
      --card-bg: #ffffff;
      --border: #e8eaed;
      --text-primary: #1f2329;
      --text-secondary: #646a73;
      --text-tertiary: #8f959e;
      --blue: #3370ff;
      --blue-bg: #e8f0ff;
      --green: #34c759;
      --green-bg: #e8f8ec;
      --orange: #f7ba1e;
      --orange-bg: #fdf3e0;
      --gray: #8f959e;
      --gray-bg: #f0f1f4;
      --red: #f54a45;
      --red-bg: #fee9e9;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
    }
    /* Component: Header */
    .header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-sub { font-size: 12px; color: var(--text-tertiary); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      background: var(--gray-bg);
      color: var(--text-secondary);
    }
    .stat-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-initial { background: var(--gray); }
    .dot-review { background: var(--orange); }
    .dot-stable { background: var(--blue); }
    .dot-final { background: var(--green); }
    .dot-blank { background: var(--red); }

    /* Component: FilterBar */
    .filter-bar {
      background: var(--card-bg);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .filter-group { display: flex; align-items: center; gap: 6px; }
    .filter-label { font-size: 12px; color: var(--text-tertiary); }
    .filter-select, .filter-input {
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 13px;
      color: var(--text-primary);
      background: #fff;
      outline: none;
      cursor: pointer;
    }
    .filter-select:hover, .filter-input:hover { border-color: var(--blue); }
    .filter-input { width: 220px; cursor: text; }
    .filter-spacer { flex: 1; }

    /* Component: Matrix */
    .matrix-wrap {
      padding: 16px 24px;
      overflow-x: auto;
    }
    .matrix-card {
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    table.matrix {
      width: 100%;
      border-collapse: collapse;
      min-width: 1200px;
    }
    table.matrix th, table.matrix td {
      border: 1px solid var(--border);
      padding: 0;
      text-align: center;
    }
    table.matrix thead th {
      background: #fafbfc;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 10px 8px;
      position: sticky;
      top: 0;
    }
    table.matrix thead th.col-deliv { text-align: left; padding-left: 16px; min-width: 200px; }
    table.matrix thead th.col-stage { min-width: 96px; }
    table.matrix thead th.sub-stage { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
    table.matrix thead th.stage-group { background: #f0f2f5; font-size: 11px; color: var(--text-tertiary); }
    table.matrix tbody tr:hover { background: #f8faff; }
    table.matrix td.col-deliv {
      text-align: left;
      padding: 12px 16px;
      vertical-align: middle;
    }
    .deliv-name { font-weight: 600; font-size: 13px; }
    .deliv-stage-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 11px;
      padding: 1px 8px;
      border-radius: 10px;
      background: var(--blue-bg);
      color: var(--blue);
    }
    .deliv-type { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

    /* Status cells */
    .cell {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .cell:hover { transform: scale(1.06); }
    .status-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .st-initial { background: var(--gray-bg); color: var(--gray); }
    .st-review { background: var(--orange-bg); color: var(--orange); }
    .st-stable { background: var(--blue-bg); color: var(--blue); }
    .st-final { background: var(--green-bg); color: var(--green); }
    .st-blank { background: var(--red-bg); color: var(--red); font-weight: 600; }
    .st-blank::before { content: "⚠ "; }

    /* Component: Drawer */
    .drawer-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 200;
      display: none;
    }
    .drawer-mask.open { display: block; }
    .drawer {
      position: fixed;
      top: 0; right: -440px;
      width: 420px;
      height: 100%;
      background: var(--card-bg);
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
      z-index: 201;
      transition: right 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { right: 0; }
    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-title { font-size: 15px; font-weight: 600; }
    .drawer-close { cursor: pointer; font-size: 18px; color: var(--text-tertiary); background: none; border: none; }
    .drawer-close:hover { color: var(--text-primary); }
    .drawer-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
    .drawer-section { margin-bottom: 20px; }
    .drawer-section h4 { font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px; font-weight: 500; }
    .drawer-row { display: flex; margin-bottom: 10px; }
    .drawer-row .k { width: 110px; color: var(--text-secondary); font-size: 13px; flex-shrink: 0; }
    .drawer-row .v { font-size: 13px; flex: 1; }
    .doc-link { color: var(--blue); text-decoration: none; cursor: pointer; }
    .doc-link:hover { text-decoration: underline; }
    .timeline-item {
      position: relative;
      padding-left: 16px;
      padding-bottom: 14px;
      border-left: 2px solid var(--border);
      margin-left: 4px;
    }
    .timeline-item:last-child { border-left-color: transparent; }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 4px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--blue);
    }
    .timeline-time { font-size: 11px; color: var(--text-tertiary); }
    .timeline-text { font-size: 13px; margin-top: 2px; }
    .stage-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .stage-grid .si { font-size: 11px; padding: 4px 8px; border-radius: 6px; background: #f5f6f8; display: flex; justify-content: space-between; }
    .si .ok { color: var(--green); }
    .si .no { color: var(--red); }

    /* Legend */
    .legend {
      display: flex;
      gap: 16px;
      padding: 8px 24px 0;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }

    .empty-row td { padding: 40px; color: var(--text-tertiary); }
  </style>
</head>
<body>

<!-- Component: Header -->
<div class="header">

    <span class="stat-pill"><span class="dot dot-stable"></span>Stable <b id="cnt-stable">0</b></span>
    <span class="stat-pill"><span class="dot dot-final"></span>Final <b id="cnt-final">0</b></span>
    <span class="stat-pill"><span class="dot dot-blank"></span>空白风险 <b id="cnt-blank">0</b></span>
  </div>
</div>

<!-- Component: FilterBar -->
<div class="filter-bar">

    <span class="filter-label">阶段</span>
    <select class="filter-select" id="f-stage">
      <option value="">全部阶段</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">状态</span>
    <select class="filter-select" id="f-status">
      <option value="">全部状态</option>
      <option value="Initial">Initial</option>
      <option value="Review">Review</option>
      <option value="Stable">Stable</option>
      <option value="Final">Final</option>
      <option value="blank">空白</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">类型</span>
    <select class="filter-select" id="f-type">
      <option value="">全部类型</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">责任人</span>
    <select class="filter-select" id="f-owner">
      <option value="">全部责任人</option>

  </div>
  <div class="filter-spacer"></div>
  <input class="filter-input" id="f-kw" placeholder="搜索交付物名称/关键词…" />
</div>

<div class="legend">
  <div class="legend-item"><span class="status-badge st-initial">Initial</span> 刚创建，内容待填充</div>
  <div class="legend-item"><span class="status-badge st-review">Review</span> 已提交评审中</div>
  <div class="legend-item"><span class="status-badge st-stable">Stable</span> 内容稳定</div>
  <div class="legend-item"><span class="status-badge st-final">Final</span> 已定稿签发</div>
  <div class="legend-item"><span class="status-badge st-blank">空白</span> 应交未交，风险</div>
</div>

<!-- Component: Matrix -->
<div class="matrix-wrap">
  <div class="matrix-card">
    <table class="matrix">
      <thead id="matrix-head"></thead>
      <tbody id="matrix-body"></tbody>
    </table>
  </div>
</div>

<!-- Component: Drawer -->
<div class="drawer-mask" id="drawer-mask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title" id="drawer-title">交付物详情</div>
    <button class="drawer-close" id="drawer-close">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

/* ====================== Render Layer ====================== */
function buildHead() {
  let html = "<tr>";
  html += '<th class="col-deliv">交付物文档</th>';
  STAGES.forEach(s => {
    if (s.subs) {
      html += `<th class="stage-group" colspan="${s.subs.length}">${s.name}</th>`;
    } else {
      html += `<th class="col-stage">${s.name}</th>`;
    }
  });
  html += "</tr><tr>";
  html += '<th class="col-deliv"></th>';
  STAGES.forEach(s => {
    if (s.subs) {
      s.subs.forEach(sub => {
        html += `<th class="col-stage sub-stage">${sub}</th>`;
      });
    } else {
      html += `<th class="col-stage sub-stage">${s.name}</th>`;
    }
  });
  html += "</tr>";
  document.getElementById('matrix-head').innerHTML = html;
}

function stageKeyToCol(key) {
  // returns the column index (0-based from first stage col)
  let idx = 0;
  for (const s of STAGES) {
    if (s.subs) {
      if (s.subs.some(sub => key === s.key + "_" + sub.replace('%','').toLowerCase())) return idx;
      idx += s.subs.length;
    } else {
      if (s.key === key) return idx;
      idx += 1;
    }
  }
  return -1;
}

function getAllStateEntries(d) {
  // returns [{stage, sub, key, value}]
  const entries = [];
  STAGES.forEach(s => {
    if (s.subs) {
      s.subs.forEach(sub => {
        const k = s.key + "_" + sub.replace('%','').toLowerCase();
        entries.push({ stage: s.name, sub, key: k, value: d.states[k] || "" });
      });
    } else {
      entries.push({ stage: s.name, sub: "", key: s.key, value: d.states[s.key] || "" });
    }
  });
  return entries;
}

function statusClass(v) {
  if (!v) return "st-blank";
  return "st-" + v.toLowerCase();
}

function statusLabel(v) {
  return v || "空白";
}

function buildBody() {
  const tbody = document.getElementById('matrix-body');
  const rows = getFiltered();
  if (rows.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="13">无符合条件的交付物，请调整筛选条件。</td></tr>';
    return;
  }
  let html = "";
  rows.forEach(d => {
    html += `<tr>`;
    html += `<td class="col-deliv">
      <div class="deliv-name">${d.name}</div>
      <span class="deliv-stage-tag">卡控：${d.gateStage}</span>
      <div class="deliv-type">类型：${d.type} · 责任人：${d.owner}</div>
    </td>`;
    STAGES.forEach(s => {
      if (s.subs) {
        s.subs.forEach(sub => {
          const k = s.key + "_" + sub.replace('%','').toLowerCase();
          const v = d.states[k] || "";
          html += `<td><div class="cell" data-did="${d.id}" data-dkey="${k}" data-stage="${s.name}" data-sub="${sub}">`;
          if (v) {
            html += `<span class="status-badge ${statusClass(v)}">${v}</span>`;
          } else {
            html += `<span class="status-badge st-blank">空白</span>`;
          }
          html += `</div></td>`;
        });
      } else {
        const v = d.states[s.key] || "";
        html += `<td><div class="cell" data-did="${d.id}" data-dkey="${s.key}" data-stage="${s.name}" data-sub="">`;
        if (v) {
          html += `<span class="status-badge ${statusClass(v)}">${v}</span>`;
        } else {
          html += `<span class="status-badge st-blank">空白</span>`;
        }
        html += `</div></td>`;
      }
    });
    html += `</tr>`;
  });
  tbody.innerHTML = html;
  bindCellClicks();
}

function updateStats() {
  let ci=0, cr=0, cs=0, cf=0, cb=0;
  DELIVERABLES.forEach(d => {
    getAllStateEntries(d).forEach(e => {
      if (e.value === "Initial") ci++;
      else if (e.value === "Review") cr++;
      else if (e.value === "Stable") cs++;
      else if (e.value === "Final") cf++;
      else cb++;
    });
  });
  document.getElementById('cnt-initial').textContent = ci;
  document.getElementById('cnt-review').textContent = cr;
  document.getElementById('cnt-stable').textContent = cs;
  document.getElementById('cnt-final').textContent = cf;
  document.getElementById('cnt-blank').textContent = cb;
}

/* ====================== Filter Layer ====================== */
function getFiltered() {
  const fStage = document.getElementById('f-stage').value;
  const fStatus = document.getElementById('f-status').value;
  const fType = document.getElementById('f-type').value;
  const fOwner = document.getElementById('f-owner').value;
  const kw = document.getElementById('f-kw').value.trim().toLowerCase();

  return DELIVERABLES.filter(d => {
    if (fType && d.type !== fType) return false;
    if (fOwner && d.owner !== fOwner) return false;
    if (kw && !d.name.toLowerCase().includes(kw) && !d.type.toLowerCase().includes(kw)) return false;
    const entries = getAllStateEntries(d);
    if (fStage) {
      // fStage is stage name; only show deliverables that have non-blank in that stage group
      const stageObj = STAGES.find(s => s.name === fStage);
      if (stageObj) {
        let hasInStage = false;
        if (stageObj.subs) {
          stageObj.subs.forEach(sub => {
            const k = stageObj.key + "_" + sub.replace('%','').toLowerCase();
            if (d.states[k]) hasInStage = true;
          });
        } else {
          if (d.states[stageObj.key]) hasInStage = true;
        }
        if (!hasInStage) return false;
      }
    }
    if (fStatus) {
      if (fStatus === "blank") {
        if (!entries.some(e => !e.value)) return false;
      } else {
        if (!entries.some(e => e.value === fStatus)) return false;
      }
    }
    return true;
  });
}

function initFilters() {
  const stageSel = document.getElementById('f-stage');
  STAGES.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.name;
    opt.textContent = s.name;
    stageSel.appendChild(opt);
  });
  const typeSel = document.getElementById('f-type');
  [...new Set(DELIVERABLES.map(d => d.type))].forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typeSel.appendChild(opt);
  });
  const ownerSel = document.getElementById('f-owner');
  [...new Set(DELIVERABLES.map(d => d.owner))].forEach(o => {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    ownerSel.appendChild(opt);
  });
  ['f-stage','f-status','f-type','f-owner','f-kw'].forEach(id => {
    document.getElementById(id).addEventListener('input', buildBody);
    document.getElementById(id).addEventListener('change', buildBody);
  });
}

/* ====================== Drawer Layer ====================== */
function bindCellClicks() {
  document.querySelectorAll('.cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const did = cell.getAttribute('data-did');
      const dkey = cell.getAttribute('data-dkey');
      const stage = cell.getAttribute('data-stage');
      const sub = cell.getAttribute('data-sub');
      openDrawer(did, dkey, stage, sub);
    });
  });
}

function openDrawer(did, dkey, stage, sub) {
  const d = DELIVERABLES.find(x => x.id === did);
  if (!d) return;
  const curVal = d.states[dkey] || "";
  document.getElementById('drawer-title').textContent = d.name;
  const body = document.getElementById('drawer-body');

  let stageGridHtml = '<div class="stage-grid">';
  getAllStateEntries(d).forEach(e => {
    const label = e.sub ? `${e.stage}-${e.sub}` : e.stage;
    const isCurrent = e.key === dkey;
    if (e.value) {
      stageGridHtml += `<div class="si" style="${isCurrent?'box-shadow:0 0 0 2px var(--blue) inset;':''}"><span>${label}</span><span class="ok">${e.value}</span></div>`;
    } else {
      stageGridHtml += `<div class="si" style="${isCurrent?'box-shadow:0 0 0 2px var(--red) inset;':''}"><span>${label}</span><span class="no">空白</span></div>`;
    }
  });
  stageGridHtml += '</div>';

  let timelineHtml = '';
  d.timeline.forEach(t => {
    timelineHtml += `<div class="timeline-item"><div class="timeline-time">${t.t}</div><div class="timeline-text">${t.text}</div></div>`;
  });

  const stageLabel = sub ? `${stage}-${sub}` : stage;

  body.innerHTML = `
    <div class="drawer-section">
      <h4>基本信息</h4>
      <div class="drawer-row"><div class="k">交付物名称</div><div class="v">${d.name}</div></div>
      <div class="drawer-row"><div class="k">交付物类型</div><div class="v">${d.type}</div></div>
      <div class="drawer-row"><div class="k">卡控阶段</div><div class="v">${d.gateStage}</div></div>
      <div class="drawer-row"><div class="k">责任人</div><div class="v">${d.owner}</div></div>
      <div class="drawer-row"><div class="k">文档链接</div><div class="v"><a class="doc-link" href="https://${d.docLink}" target="_blank">${d.docLink}</a></div></div>
    </div>
    <div class="drawer-section">
      <h4>当前单元格 · ${stageLabel}</h4>
      <div class="drawer-row"><div class="k">当前状态</div><div class="v"><span class="status-badge ${statusClass(curVal)}">${statusLabel(curVal)}</span></div></div>
      <div class="drawer-row"><div class="k">应交口径</div><div class="v">${d.criteria}</div></div>
    </div>
    <div class="drawer-section">
      <h4>各阶段状态</h4>
      ${stageGridHtml}
    </div>
    <div class="drawer-section">
      <h4>最近更新记录</h4>
      ${timelineHtml}
    </div>
  `;

  document.getElementById('drawer-mask').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer-mask').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

/* ====================== Init ====================== */
function init() {
  buildHead();
  initFilters();
  buildBody();
  updateStats();
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  document.getElementById('drawer-mask').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
}
init();
</script>
</body>
</html>
